name: tquant-separated

services:
  frontend-web:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    image: tquant-frontend-web:local
    container_name: tquant-frontend-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_WEB_PORT:-18080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null && wget -qO- http://127.0.0.1/next/ >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ANALYTICS: "0"
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-}
        DEBIAN_APT_SECURITY_MIRROR: ${DEBIAN_APT_SECURITY_MIRROR:-}
    image: tquant-backend-api:local
    container_name: tquant-backend-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_API_PORT:-18090}:8000"
    environment:
      APP_NAME: ${APP_NAME:-维斯量化交易平台}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      API_PREFIX: ${API_PREFIX:-/api}
      SERVE_FRONTEND_STATIC: "false"
      DATABASE_URL: mysql+mysqldb://${MYSQL_USER:-tquant_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-t_quant}?charset=utf8mb4
      DB_POOL_SIZE: ${WEB_DB_POOL_SIZE:-4}
      DB_MAX_OVERFLOW: ${WEB_DB_MAX_OVERFLOW:-4}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RUNTIME_EVENT_PUBSUB_BACKEND: ${RUNTIME_EVENT_PUBSUB_BACKEND:-redis}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:18080,http://127.0.0.1:18080,http://localhost:18090,http://127.0.0.1:18090}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      TQUANT_SETTINGS_ENCRYPTION_KEY: ${TQUANT_SETTINGS_ENCRYPTION_KEY:?TQUANT_SETTINGS_ENCRYPTION_KEY is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ALLOW_INSECURE_HTTP_COOKIE: ${AUTH_ALLOW_INSECURE_HTTP_COOKIE:-false}
      RUNTIME_BACKGROUND_JOBS_ENABLED: ${WEB_RUNTIME_BACKGROUND_JOBS_ENABLED:-false}
      RUNTIME_BACKGROUND_ROLE: web
      GLOBAL_RATE_LIMIT_BACKEND: ${GLOBAL_RATE_LIMIT_BACKEND:-redis}
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-true}
      APP_WORKERS: ${APP_WORKERS:-2}
      TQUANT_BFF_GATEWAY_URL: ${TQUANT_BFF_GATEWAY_URL:-http://go-bff-gateway:8091}
      TQUANT_MARKET_READ_SERVICE_URL: ${TQUANT_MARKET_READ_SERVICE_URL:-http://go-market-read-service:8092}
      TQUANT_GO_SCAN_WORKER_URL: ${TQUANT_GO_SCAN_WORKER_URL:-http://go-scan-worker:8093}
      BFF_WORKSPACE_CACHE_ENABLED: ${BFF_WORKSPACE_CACHE_ENABLED:-true}
    volumes:
      - app_runtime_data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    container_name: tquant-separated-gateway
    restart: unless-stopped
    depends_on:
      frontend-web:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-18000}:80"
    volumes:
      - ./deploy/nginx/tquant-separated-gateway.conf.template:/etc/nginx/conf.d/default.conf:ro

  mysql:
    extends:
      file: docker-compose.mysql.yml
      service: mysql

  redis:
    extends:
      file: docker-compose.mysql.yml
      service: redis

  migration:
    extends:
      file: docker-compose.mysql.yml
      service: migration

volumes:
  mysql_data:
  redis_data:
  app_runtime_data:
