<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TQuant 离线提示</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e5e7eb;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top right, rgba(214, 165, 92, 0.2), transparent 32%),
          linear-gradient(180deg, #0f172a 0%, #111827 100%);
      }
      main {
        width: min(560px, calc(100vw - 32px));
        padding: 28px;
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.22);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.7;
        color: #cbd5e1;
      }
      .tips {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(30, 41, 59, 0.88);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前处于离线状态</h1>
      <p>TQuant 已加载本地缓存的前端资源，但实时行情、回测任务和配置保存需要网络恢复后才能继续。</p>
      <div class="tips">
        <p>可继续查看已缓存页面和摘要数据。</p>
        <p>网络恢复后刷新页面，系统会自动重新连接最新数据。</p>
      </div>
    </main>
  </body>
</html>
