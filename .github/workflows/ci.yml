name: ci

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -r backend/requirements-analytics.txt
      - name: Compile backend
        run: python -m compileall backend/app
      - name: Run Agent OS scoped coverage gate
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: |
          echo "Agent OS scoped coverage gate only: provider/tools/agent routes/auth/report/research services. This is not whole-project coverage."
          pytest backend/tests/test_agent*.py \
            --cov=app.agent_providers \
            --cov=app.agent_tools \
            --cov=app.api.routes.agent \
            --cov=app.api.routes.agent_helpers \
            --cov=app.core.agent_auth \
            --cov=app.services.agent_context_service \
            --cov=app.services.agent_report_service \
            --cov=app.services.agent_research_service \
            --cov=app.services.agent_daily_workflow_service \
            --cov-report=term-missing \
            --cov-fail-under=70
      - name: Run backend pytest suite
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: pytest backend/tests
      - name: Enforce backend warning budget
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: python scripts/warning_budget.py backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies for API contract export
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend API contract
        working-directory: frontend
        run: npm run api:check
      - name: Verify generated frontend files are current
        run: |
          python scripts/sync_strategy_meta_fallback.py
          git diff --exit-code -- frontend/src/generated/strategyMetaFallback.ts
      - name: Run frontend lint and refactor guards
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check frontend bundle budget
        working-directory: frontend
        run: node ./scripts/bundle-report.mjs && npm run check:bundle-budget
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Upload frontend dist artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  go-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Go service tests
        run: |
          (cd go-services/bff-gateway && go test ./...)
          (cd go-services/market-read-service && go test ./...)
          (cd go-services/scan-worker && go test ./...)
      - name: Run Rust tests and wheel smoke
        run: |
          (cd rust/tquant-rs && cargo test)
          python -m pip install --upgrade pip maturin
          (cd rust/tquant-rs && maturin build --release --features extension-module --out dist)
          python -m pip install rust/tquant-rs/dist/*.whl
          python - <<'PY'
          import tquant_rs
          assert tquant_rs.max_drawdown([100.0, 80.0, 120.0]) == 0.2
          assert abs(tquant_rs.rank_ic([1.0, 2.0, 3.0], [3.0, 2.0, 1.0]) + 1.0) < 1e-9
          PY
      - name: Run Rust finance benchmarks
        run: |
          mkdir -p docs/reports
          (cd rust/tquant-rs && cargo bench --features extension-module --bench finance -- --output-format bencher 2>&1) | tee docs/reports/rust-finance-bench.txt
          python scripts/check_rust_bench_baseline.py docs/reports/rust-bench-baseline.json docs/reports/rust-finance-bench.txt
      - name: Upload Rust benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-finance-bench
          path: docs/reports/rust-finance-bench.txt

  deploy:
    needs: [backend, frontend, go-rust]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Select deploy target scope
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$before" "$after")"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          else
            changed_files=""
          fi
          printf '%s\n' "$changed_files" > /tmp/gupiao_changed_files.txt
          scope=ops
          has_frontend=0
          has_go=0
          has_ops=0
          if [ -z "$changed_files" ]; then
            scope=all
          else
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                frontend/*)
                  has_frontend=1
                  ;;
                go-services/*)
                  has_go=1
                  ;;
                docs/*|AGENTS.md|IMPLEMENTATION_PLAN.md)
                  ;;
                .github/workflows/ci.yml|.gitignore|.env.deploy.local.example|Makefile|backend/tests/test_cloud_deploy_scripts.py|scripts/cloud_ssh_lib.sh|scripts/deploy_cloud_server.sh|scripts/quick_cloud_deploy.sh|scripts/one_click_cloud_deploy.sh|scripts/install_https_nginx.sh|scripts/install_backup_cron.sh|scripts/backup_database.sh|scripts/clean_local_artifacts.sh|scripts/run_platform_component.sh)
                  has_ops=1
                  ;;
                *)
                  scope=all
                  ;;
              esac
              [ "$scope" = all ] && break
            done <<< "$changed_files"
            if [ "$scope" != all ]; then
              if [ "$has_frontend" = 1 ] && [ "$has_go" = 0 ] && [ "$has_ops" = 0 ]; then
                scope=frontend-hot
              elif [ "$has_frontend" = 0 ] && [ "$has_go" = 1 ] && [ "$has_ops" = 0 ]; then
                scope=go
              elif [ "$has_frontend" = 0 ] && [ "$has_go" = 0 ]; then
                scope=ops
              else
                scope=all
              fi
            fi
          fi
          echo "DEPLOY_TARGET_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "DEPLOY_CHANGED_FILES<<DEPLOY_FILES" >> "$GITHUB_ENV"
          cat /tmp/gupiao_changed_files.txt >> "$GITHUB_ENV"
          echo "DEPLOY_FILES" >> "$GITHUB_ENV"
          echo "selected deploy scope: $scope"
      - name: Deploy through project script
        env:
          CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
          CLOUD_SSH_KEY_PATH: ${{ secrets.CLOUD_SSH_KEY_PATH }}
          CLOUD_SSH_KEY_CONTENT: ${{ secrets.CLOUD_SSH_KEY }}
          CLOUD_PASSWORD: ${{ secrets.CLOUD_PASSWORD }}
          CLOUD_DOMAIN: ${{ secrets.CLOUD_DOMAIN }}
          CLOUD_CERT_EMAIL: ${{ secrets.CLOUD_CERT_EMAIL }}
          BACKUP_TIME: ${{ secrets.BACKUP_TIME }}
          AUTO_INSTALL_BACKUP_CRON: "1"
          AUTO_CONFIGURE_HTTPS: "1"
          HTTPS_REQUIRED: "1"
          RUN_COMPILE: "0"
          RUN_FRONTEND_BUILD: "0"
          RUN_STRATEGY_TEST: "0"
          RUN_FULL_TESTS: "0"
          DEPLOY_FRONTEND_HOT_REQUIRED: "1"
          DEPLOY_SYNC_MODE: "package-only"
          DEPLOY_GIT_REF: ${{ github.sha }}
          DEPLOY_GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${CLOUD_HOST}" ] || [ -z "${CLOUD_USER}" ]; then
            echo "CLOUD_HOST/CLOUD_USER secrets 未配置，不能执行真实部署。"
            exit 2
          fi
          export CLOUD_DOMAIN="${CLOUD_DOMAIN:-weisilianghua.cloud}"
          export CLOUD_CERT_EMAIL="${CLOUD_CERT_EMAIL:-admin@${CLOUD_DOMAIN}}"
          export BACKUP_TIME="${BACKUP_TIME:-02:20}"
          if [ -n "${CLOUD_SSH_KEY_CONTENT}" ]; then
            printf '%s\n' "${CLOUD_SSH_KEY_CONTENT}" > /tmp/cloud_ssh_key
            chmod 600 /tmp/cloud_ssh_key
            export CLOUD_SSH_KEY=/tmp/cloud_ssh_key
          elif [ -n "${CLOUD_SSH_KEY_PATH}" ]; then
            export CLOUD_SSH_KEY="${CLOUD_SSH_KEY_PATH}"
          fi
          ./scripts/deploy_cloud_server.sh
