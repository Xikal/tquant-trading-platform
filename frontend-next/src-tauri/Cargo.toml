[package]
name = "tquant-local"
version = "0.9.0"
description = "Local desktop shell for the quantitative trading platform"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
