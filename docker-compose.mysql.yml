name: tquant-mysql

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    container_name: tquant-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-t_quant}
      MYSQL_USER: ${MYSQL_USER:-tquant_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tquant-web:mysql
    container_name: tquant-app-mysql
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-18090}:8000"
    environment:
      APP_NAME: ${APP_NAME:-维斯量化交易平台}
      API_PREFIX: ${API_PREFIX:-/api}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-tquant_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-t_quant}?charset=utf8mb4
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:18080,http://127.0.0.1:18080,http://localhost:18090,http://127.0.0.1:18090}
      DEFAULT_DATA_SOURCE: ${DEFAULT_DATA_SOURCE:-akshare_eastmoney}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-12}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-none}
      AGENT_API_BASE: ${AGENT_API_BASE:-http://127.0.0.1:8000/api}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-10}
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      PAPER_AUTO_TRADING_ENABLED: ${PAPER_AUTO_TRADING_ENABLED:-true}
      PAPER_AUTO_TRADING_INTERVAL: ${PAPER_AUTO_TRADING_INTERVAL:-120}
      PAPER_AUTO_TRADING_MAX_ORDERS: ${PAPER_AUTO_TRADING_MAX_ORDERS:-5}
      PAPER_AUTO_TRADING_DRY_RUN: ${PAPER_AUTO_TRADING_DRY_RUN:-false}
      PAPER_AUTO_TRADING_MIN_SCORE: ${PAPER_AUTO_TRADING_MIN_SCORE:-75}
      RUNTIME_BACKGROUND_JOBS_ENABLED: ${WEB_RUNTIME_BACKGROUND_JOBS_ENABLED:-false}
      RUNTIME_BACKGROUND_JOBS_ON_SQLITE: ${RUNTIME_BACKGROUND_JOBS_ON_SQLITE:-false}
      SCHEMA_COMPAT_REPAIR_ENABLED: ${SCHEMA_COMPAT_REPAIR_ENABLED:-false}
      GLOBAL_RATE_LIMIT_BACKEND: ${GLOBAL_RATE_LIMIT_BACKEND:-sqlite}
    volumes:
      - app_runtime_data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  runtime-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: tquant-web:mysql
    container_name: tquant-runtime-worker-mysql
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.runtime_worker"]
    environment:
      APP_NAME: ${APP_NAME:-维斯量化交易平台}
      API_PREFIX: ${API_PREFIX:-/api}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-tquant_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-t_quant}?charset=utf8mb4
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:18080,http://127.0.0.1:18080,http://localhost:18090,http://127.0.0.1:18090}
      DEFAULT_DATA_SOURCE: ${DEFAULT_DATA_SOURCE:-akshare_eastmoney}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-12}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-none}
      AGENT_API_BASE: ${AGENT_API_BASE:-http://app:8000/api}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-10}
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      PAPER_AUTO_TRADING_ENABLED: ${PAPER_AUTO_TRADING_ENABLED:-true}
      PAPER_AUTO_TRADING_INTERVAL: ${PAPER_AUTO_TRADING_INTERVAL:-120}
      PAPER_AUTO_TRADING_MAX_ORDERS: ${PAPER_AUTO_TRADING_MAX_ORDERS:-5}
      PAPER_AUTO_TRADING_DRY_RUN: ${PAPER_AUTO_TRADING_DRY_RUN:-false}
      PAPER_AUTO_TRADING_MIN_SCORE: ${PAPER_AUTO_TRADING_MIN_SCORE:-75}
      RUNTIME_BACKGROUND_JOBS_ENABLED: ${RUNTIME_BACKGROUND_JOBS_ENABLED:-false}
      RUNTIME_BACKGROUND_JOBS_ON_SQLITE: ${RUNTIME_BACKGROUND_JOBS_ON_SQLITE:-false}
      RUNTIME_WORKER_POLL_INTERVAL_SECONDS: ${RUNTIME_WORKER_POLL_INTERVAL_SECONDS:-5}
      SCHEMA_COMPAT_REPAIR_ENABLED: ${SCHEMA_COMPAT_REPAIR_ENABLED:-false}
      GLOBAL_RATE_LIMIT_BACKEND: ${GLOBAL_RATE_LIMIT_BACKEND:-memory}
    volumes:
      - app_runtime_data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "from app.core.database import ping_database; ping_database()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  backtest-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: tquant-web:mysql
    container_name: tquant-backtest-worker-mysql
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    command: ["python", "-c", "from app.services.backtest_worker import BacktestWorker; BacktestWorker(max_duration_seconds=${BACKTEST_WORKER_MAX_DURATION:-3600}).run_forever(poll_interval_seconds=${BACKTEST_WORKER_POLL_INTERVAL:-5})"]
    environment:
      APP_NAME: ${APP_NAME:-维斯量化交易平台}
      API_PREFIX: ${API_PREFIX:-/api}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-tquant_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-t_quant}?charset=utf8mb4
      DEFAULT_DATA_SOURCE: ${DEFAULT_DATA_SOURCE:-akshare_eastmoney}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-12}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      SCHEMA_COMPAT_REPAIR_ENABLED: ${SCHEMA_COMPAT_REPAIR_ENABLED:-false}

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    image: tquant-web:mysql
    container_name: tquant-migration-mysql
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-tquant_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-t_quant}?charset=utf8mb4
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      SCHEMA_COMPAT_REPAIR_ENABLED: "false"
    volumes:
      - app_runtime_data:/app/backend/data

volumes:
  mysql_data:
  app_runtime_data:
