name: tquant-mysql

x-low-priority-task-types: &low_priority_task_types ${RUNTIME_LOW_PRIORITY_TASK_TYPES:-analytics_export_daily_bars,analytics_export_strategy_tracking_snapshots,analytics_export_key_level_snapshots,analytics_export_low_buy_result_snapshots,analytics_export_backtest_runs,analytics_export_backtest_trades,analytics_export_backtest_daily_snapshots,analytics_export_analysis_logs,analytics_export_market_review_reports,strategy_24m_duckdb_report,decision_context_24m_report,portfolio_execution_24m_report,backtest_all_strategies_24m,data_backfill_24m,data_quality_backfill,data_repair_run,low_buy_execution_backtest,legacy_research_backtest,etf_t0_minute_backtest,etf_t0_research_report,backtest_portfolio_optimization,backtest_position_policy_research,trading_experience_limit_up_backtest,ml_signal_build_samples,ml_signal_train,ml_signal_incremental_train,factor_mining_iterate,factor_mining_evaluate,factor_mining_monthly}

x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-50m}
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    container_name: tquant-mysql
    restart: unless-stopped
    mem_limit: ${MYSQL_MEM_LIMIT:-1024m}
    memswap_limit: ${MYSQL_MEMSWAP_LIMIT:-1280m}
    cpus: ${MYSQL_CPUS:-1.50}
    logging: *default_logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-t_quant}
      MYSQL_USER: ${MYSQL_USER:-tquant_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-120}
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}
      - --innodb-log-file-size=${MYSQL_INNODB_LOG_FILE_SIZE:-256M}
      - --innodb-flush-log-at-trx-commit=${MYSQL_INNODB_FLUSH_LOG_AT_TRX_COMMIT:-2}
      - --binlog-expire-logs-seconds=${MYSQL_BINLOG_EXPIRE_LOGS_SECONDS:-259200}
      - --max-binlog-size=${MYSQL_MAX_BINLOG_SIZE:-256M}
      - --slow-query-log=${MYSQL_SLOW_QUERY_LOG:-ON}
      - --long-query-time=${MYSQL_LONG_QUERY_TIME:-0.2}
      - --log-output=${MYSQL_LOG_OUTPUT:-FILE}
      - --slow-query-log-file=/var/lib/mysql/mysql-slow.log
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: tquant-redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    memswap_limit: ${REDIS_MEMSWAP_LIMIT:-192m}
    cpus: ${REDIS_CPUS:-0.50}
    logging: *default_logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 64mb
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20-bookworm-slim}
        RUST_BASE_IMAGE: ${RUST_BASE_IMAGE:-docker.m.daocloud.io/library/rust:1.95-bookworm}
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
        INSTALL_ANALYTICS: "0"
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-}
        DEBIAN_APT_SECURITY_MIRROR: ${DEBIAN_APT_SECURITY_MIRROR:-}
    image: tquant-web:mysql
    container_name: tquant-app-mysql
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-768m}
    memswap_limit: ${APP_MEMSWAP_LIMIT:-1024m}
    cpus: ${APP_CPUS:-1.50}
    logging: *default_logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-18090}:8000"
    environment:
      APP_NAME: ${APP_NAME:-维斯量化交易平台}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      API_PREFIX: ${API_PREFIX:-/api}
      DATABASE_URL: mysql+mysqldb://${MYSQL_USER:-tquant_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-t_quant}?charset=utf8mb4
      DB_POOL_SIZE: ${WEB_DB_POOL_SIZE:-4}
      DB_MAX_OVERFLOW: ${WEB_DB_MAX_OVERFLOW:-4}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:18080,http://127.0.0.1:18080,http://localhost:18090,http://127.0.0.1:18090}
      DEFAULT_DATA_SOURCE: ${DEFAULT_DATA_SOURCE:-akshare_eastmoney}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-12}
      MARKET_QUOTE_ASYNC_PROVIDER_ENABLED: ${MARKET_QUOTE_ASYNC_PROVIDER_ENABLED:-true}
      MARKET_QUOTE_ASYNC_PROVIDER_CHUNK_SIZE: ${MARKET_QUOTE_ASYNC_PROVIDER_CHUNK_SIZE:-60}
      MARKET_QUOTE_ASYNC_PROVIDER_CONCURRENCY: ${MARKET_QUOTE_ASYNC_PROVIDER_CONCURRENCY:-4}
      MARKET_REGIME_PROVIDER_DEGRADED_COOLDOWN_SECONDS: ${MARKET_REGIME_PROVIDER_DEGRADED_COOLDOWN_SECONDS:-300}
      MARKET_REGIME_PROVIDER_DEGRADED_COOLDOWN_MAX_SECONDS: ${MARKET_REGIME_PROVIDER_DEGRADED_COOLDOWN_MAX_SECONDS:-1800}
      MARKET_REGIME_PROVIDER_DEGRADED_BACKOFF_FACTOR: ${MARKET_REGIME_PROVIDER_DEGRADED_BACKOFF_FACTOR:-2}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      TQUANT_SETTINGS_ENCRYPTION_KEY: ${TQUANT_SETTINGS_ENCRYPTION_KEY:?TQUANT_SETTINGS_ENCRYPTION_KEY is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ALLOW_INSECURE_HTTP_COOKIE: ${AUTH_ALLOW_INSECURE_HTTP_COOKIE:-false}
      FRONTEND_NEXT_MONITOR_CUTOVER_ENABLED: ${FRONTEND_NEXT_MONITOR_CUTOVER_ENABLED:-false}
      FRONTEND_NEXT_CUTOVER_PATHS: ${FRONTEND_NEXT_CUTOVER_PATHS:-}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-none}
      AGENT_API_BASE: ${AGENT_API_BASE:-http://127.0.0.1:8000/api}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-10}
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      RUNTIME_BACKGROUND_JOBS_ENABLED: ${WEB_RUNTIME_BACKGROUND_JOBS_ENABLED:-false}
      RUNTIME_BACKGROUND_JOBS_ON_SQLITE: ${RUNTIME_BACKGROUND_JOBS_ON_SQLITE:-false}
      RUNTIME_BACKGROUND_ROLE: web
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RUNTIME_EVENT_PUBSUB_BACKEND: ${RUNTIME_EVENT_PUBSUB_BACKEND:-redis}
      PLATFORM_AUTOPILOT_NOTIFY_ENABLED: ${PLATFORM_AUTOPILOT_NOTIFY_ENABLED:-false}
      PLATFORM_AUTOPILOT_ENABLED: ${PLATFORM_AUTOPILOT_ENABLED:-false}
      PLATFORM_AUTOPILOT_FAILED_TASK_WINDOW_HOURS: ${PLATFORM_AUTOPILOT_FAILED_TASK_WINDOW_HOURS:-24}
      SCHEMA_COMPAT_REPAIR_ENABLED: ${SCHEMA_COMPAT_REPAIR_ENABLED:-false}
      GLOBAL_RATE_LIMIT_BACKEND: ${GLOBAL_RATE_LIMIT_BACKEND:-redis}
      GLOBAL_RATE_LIMIT_MAX_CALLS: ${GLOBAL_RATE_LIMIT_MAX_CALLS:-120}
      GLOBAL_RATE_LIMIT_WINDOW_SECONDS: ${GLOBAL_RATE_LIMIT_WINDOW_SECONDS:-1}
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-true}
      APP_WORKERS: ${APP_WORKERS:-1}
      TQUANT_ANALYTICS_ENABLED: ${WEB_TQUANT_ANALYTICS_ENABLED:-false}
      TQUANT_RESEARCH_JOBS_ENABLED: ${TQUANT_RESEARCH_JOBS_ENABLED:-false}
      TQUANT_ML_JOBS_ENABLED: ${TQUANT_ML_JOBS_ENABLED:-false}
      TQUANT_FACTOR_JOBS_ENABLED: ${TQUANT_FACTOR_JOBS_ENABLED:-false}
      TQUANT_STRATEGY_EVOLUTION_ENABLED: ${TQUANT_STRATEGY_EVOLUTION_ENABLED:-false}
      TQUANT_INTERNAL_SERVICE_TOKEN: ${TQUANT_INTERNAL_SERVICE_TOKEN:-}
      TQUANT_BFF_GATEWAY_URL: ${TQUANT_BFF_GATEWAY_URL:-http://go-bff-gateway:8091}
      TQUANT_MARKET_SERVICE_URL: ${TQUANT_MARKET_SERVICE_URL:-}
      TQUANT_MARKET_READ_SERVICE_URL: ${TQUANT_MARKET_READ_SERVICE_URL:-http://go-market-read-service:8092}
      TQUANT_GO_SCAN_WORKER_URL: ${TQUANT_GO_SCAN_WORKER_URL:-http://go-scan-worker:8093}
      TQUANT_GO_SCAN_ENABLED: ${TQUANT_GO_SCAN_ENABLED:-true}
      TQUANT_STRATEGY_SERVICE_URL: ${TQUANT_STRATEGY_SERVICE_URL:-}
      TQUANT_TRADE_SERVICE_URL: ${TQUANT_TRADE_SERVICE_URL:-}
      TQUANT_ADMIN_SERVICE_URL: ${TQUANT_ADMIN_SERVICE_URL:-}
      TQUANT_FACTOR_SERVICE_URL: ${TQUANT_FACTOR_SERVICE_URL:-}
      TQUANT_BACKTEST_SERVICE_URL: ${TQUANT_BACKTEST_SERVICE_URL:-}
      RUST_FINANCE_MATH_ENABLED: ${RUST_FINANCE_MATH_ENABLED:-true}
      BFF_WORKSPACE_CACHE_ENABLED: ${BFF_WORKSPACE_CACHE_ENABLED:-true}
      BFF_MONITOR_CACHE_TTL_SECONDS: ${BFF_MONITOR_CACHE_TTL_SECONDS:-5}
      BFF_STRATEGY_CACHE_TTL_SECONDS: ${BFF_STRATEGY_CACHE_TTL_SECONDS:-30}
      BFF_SETTINGS_CACHE_TTL_SECONDS: ${BFF_SETTINGS_CACHE_TTL_SECONDS:-30}
      PRIORITY_BOARD_WEB_SYNC_REFRESH_ENABLED: ${PRIORITY_BOARD_WEB_SYNC_REFRESH_ENABLED:-false}
      PRIORITY_BOARD_LIVE_OVERLAY_TIMEOUT_MS: ${PRIORITY_BOARD_LIVE_OVERLAY_TIMEOUT_MS:-80}
    volumes:
      - app_runtime_data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  runtime-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20-bookworm-slim}
        RUST_BASE_IMAGE: ${RUST_BASE_IMAGE:-docker.m.daocloud.io/library/rust:1.95-bookworm}
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
        INSTALL_ANALYTICS: "${BACKTEST_WORKER_INSTALL_ANALYTICS:-1}"
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-}
        DEBIAN_APT_SECURITY_MIRROR: ${DEBIAN_APT_SECURITY_MIRROR:-}
    image: tquant-web:mysql
    container_name: tquant-runtime-worker-mysql
    restart: unless-stopped
    mem_limit: ${RUNTIME_WORKER_MEM_LIMIT:-768m}
    memswap_limit: ${RUNTIME_WORKER_MEMSWAP_LIMIT:-1024m}
    cpus: ${RUNTIME_WORKER_CPUS:-1.50}
    logging: *default_logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.runtime_worker"]
    environment:
      APP_NAME: ${APP_NAME:-维斯量化交易平台}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      API_PREFIX: ${API_PREFIX:-/api}
      DATABASE_URL: mysql+mysqldb://${MYSQL_USER:-tquant_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-t_quant}?charset=utf8mb4
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-4}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-4}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:18080,http://127.0.0.1:18080,http://localhost:18090,http://127.0.0.1:18090}
      DEFAULT_DATA_SOURCE: ${DEFAULT_DATA_SOURCE:-akshare_eastmoney}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-12}
      MARKET_QUOTE_ASYNC_PROVIDER_ENABLED: ${MARKET_QUOTE_ASYNC_PROVIDER_ENABLED:-true}
      MARKET_QUOTE_ASYNC_PROVIDER_CHUNK_SIZE: ${MARKET_QUOTE_ASYNC_PROVIDER_CHUNK_SIZE:-60}
      MARKET_QUOTE_ASYNC_PROVIDER_CONCURRENCY: ${MARKET_QUOTE_ASYNC_PROVIDER_CONCURRENCY:-4}
      MARKET_REGIME_PROVIDER_DEGRADED_COOLDOWN_SECONDS: ${MARKET_REGIME_PROVIDER_DEGRADED_COOLDOWN_SECONDS:-300}
      MARKET_REGIME_PROVIDER_DEGRADED_COOLDOWN_MAX_SECONDS: ${MARKET_REGIME_PROVIDER_DEGRADED_COOLDOWN_MAX_SECONDS:-1800}
      MARKET_REGIME_PROVIDER_DEGRADED_BACKOFF_FACTOR: ${MARKET_REGIME_PROVIDER_DEGRADED_BACKOFF_FACTOR:-2}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      TQUANT_SETTINGS_ENCRYPTION_KEY: ${TQUANT_SETTINGS_ENCRYPTION_KEY:?TQUANT_SETTINGS_ENCRYPTION_KEY is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ALLOW_INSECURE_HTTP_COOKIE: ${AUTH_ALLOW_INSECURE_HTTP_COOKIE:-false}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-none}
      AGENT_API_BASE: ${AGENT_API_BASE:-http://app:8000/api}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-10}
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      RUNTIME_BACKGROUND_JOBS_ENABLED: ${RUNTIME_BACKGROUND_JOBS_ENABLED:-false}
      RUNTIME_BACKGROUND_JOBS_ON_SQLITE: ${RUNTIME_BACKGROUND_JOBS_ON_SQLITE:-false}
      RUNTIME_BACKGROUND_ROLE: worker
      RUNTIME_WORKER_EMBED_SCHEDULER: ${RUNTIME_WORKER_EMBED_SCHEDULER:-false}
      RUNTIME_WORKER_RECYCLE_RSS_MB: ${RUNTIME_WORKER_RECYCLE_RSS_MB:-0}
      RUNTIME_SCHEDULER_LEADER_LOCK_TTL_SECONDS: ${RUNTIME_SCHEDULER_LEADER_LOCK_TTL_SECONDS:-60}
      RUNTIME_WORKER_POLL_INTERVAL_SECONDS: ${RUNTIME_WORKER_POLL_INTERVAL_SECONDS:-5}
      RUNTIME_BACKGROUND_COMPACT_MODE_ENABLED: ${RUNTIME_BACKGROUND_COMPACT_MODE_ENABLED:-false}
      RUNTIME_STARTUP_CACHE_PREWARM_ENABLED: ${RUNTIME_STARTUP_CACHE_PREWARM_ENABLED:-true}
      RUNTIME_STARTUP_HISTORY_PREWARM_ENABLED: ${RUNTIME_STARTUP_HISTORY_PREWARM_ENABLED:-true}
      RUNTIME_LOW_PRIORITY_TASKS_PAUSED: ${RUNTIME_LOW_PRIORITY_TASKS_PAUSED:-false}
      RUNTIME_LOW_PRIORITY_TASK_TYPES: *low_priority_task_types
      PLATFORM_AUTOPILOT_ENABLED: ${PLATFORM_AUTOPILOT_ENABLED:-true}
      PLATFORM_AUTOPILOT_NOTIFY_ENABLED: ${PLATFORM_AUTOPILOT_NOTIFY_ENABLED:-false}
      PLATFORM_AUTOPILOT_FAILED_TASK_WINDOW_HOURS: ${PLATFORM_AUTOPILOT_FAILED_TASK_WINDOW_HOURS:-24}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RUNTIME_EVENT_PUBSUB_BACKEND: ${RUNTIME_EVENT_PUBSUB_BACKEND:-redis}
      SCHEMA_COMPAT_REPAIR_ENABLED: ${SCHEMA_COMPAT_REPAIR_ENABLED:-false}
      GLOBAL_RATE_LIMIT_BACKEND: ${GLOBAL_RATE_LIMIT_BACKEND:-redis}
      GLOBAL_RATE_LIMIT_MAX_CALLS: ${GLOBAL_RATE_LIMIT_MAX_CALLS:-120}
      GLOBAL_RATE_LIMIT_WINDOW_SECONDS: ${GLOBAL_RATE_LIMIT_WINDOW_SECONDS:-1}
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-true}
      TQUANT_RESEARCH_JOBS_ENABLED: ${TQUANT_RESEARCH_JOBS_ENABLED:-false}
      TQUANT_ML_JOBS_ENABLED: ${TQUANT_ML_JOBS_ENABLED:-false}
      TQUANT_FACTOR_JOBS_ENABLED: ${TQUANT_FACTOR_JOBS_ENABLED:-false}
      TQUANT_STRATEGY_EVOLUTION_ENABLED: ${TQUANT_STRATEGY_EVOLUTION_ENABLED:-false}
      TQUANT_INTERNAL_SERVICE_TOKEN: ${TQUANT_INTERNAL_SERVICE_TOKEN:-}
      TQUANT_BFF_GATEWAY_URL: ${TQUANT_BFF_GATEWAY_URL:-http://go-bff-gateway:8091}
      TQUANT_MARKET_SERVICE_URL: ${TQUANT_MARKET_SERVICE_URL:-}
      TQUANT_MARKET_READ_SERVICE_URL: ${TQUANT_MARKET_READ_SERVICE_URL:-http://go-market-read-service:8092}
      TQUANT_GO_SCAN_WORKER_URL: ${TQUANT_GO_SCAN_WORKER_URL:-http://go-scan-worker:8093}
      TQUANT_GO_SCAN_ENABLED: ${TQUANT_GO_SCAN_ENABLED:-true}
      TQUANT_STRATEGY_SERVICE_URL: ${TQUANT_STRATEGY_SERVICE_URL:-}
      TQUANT_TRADE_SERVICE_URL: ${TQUANT_TRADE_SERVICE_URL:-}
      TQUANT_ADMIN_SERVICE_URL: ${TQUANT_ADMIN_SERVICE_URL:-}
      TQUANT_FACTOR_SERVICE_URL: ${TQUANT_FACTOR_SERVICE_URL:-}
      TQUANT_BACKTEST_SERVICE_URL: ${TQUANT_BACKTEST_SERVICE_URL:-}
    volumes:
      - app_runtime_data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "from app.core.database import ping_database; ping_database()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  runtime-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20-bookworm-slim}
        RUST_BASE_IMAGE: ${RUST_BASE_IMAGE:-docker.m.daocloud.io/library/rust:1.95-bookworm}
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
        INSTALL_ANALYTICS: "0"
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-}
        DEBIAN_APT_SECURITY_MIRROR: ${DEBIAN_APT_SECURITY_MIRROR:-}
    image: tquant-web:mysql
    container_name: tquant-runtime-scheduler-mysql
    restart: unless-stopped
    mem_limit: ${RUNTIME_SCHEDULER_MEM_LIMIT:-640m}
    memswap_limit: ${RUNTIME_SCHEDULER_MEMSWAP_LIMIT:-768m}
    cpus: ${RUNTIME_SCHEDULER_CPUS:-1.00}
    logging: *default_logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      runtime-worker:
        condition: service_healthy
    command: ["python", "-m", "app.workers.runtime_scheduler"]
    environment:
      APP_NAME: ${APP_NAME:-维斯量化交易平台}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      API_PREFIX: ${API_PREFIX:-/api}
      DATABASE_URL: mysql+mysqldb://${MYSQL_USER:-tquant_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-t_quant}?charset=utf8mb4
      DB_POOL_SIZE: ${SCHEDULER_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${SCHEDULER_DB_MAX_OVERFLOW:-2}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:18080,http://127.0.0.1:18080,http://localhost:18090,http://127.0.0.1:18090}
      DEFAULT_DATA_SOURCE: ${DEFAULT_DATA_SOURCE:-akshare_eastmoney}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-12}
      MARKET_QUOTE_ASYNC_PROVIDER_ENABLED: ${MARKET_QUOTE_ASYNC_PROVIDER_ENABLED:-true}
      MARKET_QUOTE_ASYNC_PROVIDER_CHUNK_SIZE: ${MARKET_QUOTE_ASYNC_PROVIDER_CHUNK_SIZE:-60}
      MARKET_QUOTE_ASYNC_PROVIDER_CONCURRENCY: ${MARKET_QUOTE_ASYNC_PROVIDER_CONCURRENCY:-4}
      MARKET_REGIME_PROVIDER_DEGRADED_COOLDOWN_SECONDS: ${MARKET_REGIME_PROVIDER_DEGRADED_COOLDOWN_SECONDS:-300}
      MARKET_REGIME_PROVIDER_DEGRADED_COOLDOWN_MAX_SECONDS: ${MARKET_REGIME_PROVIDER_DEGRADED_COOLDOWN_MAX_SECONDS:-1800}
      MARKET_REGIME_PROVIDER_DEGRADED_BACKOFF_FACTOR: ${MARKET_REGIME_PROVIDER_DEGRADED_BACKOFF_FACTOR:-2}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      TQUANT_SETTINGS_ENCRYPTION_KEY: ${TQUANT_SETTINGS_ENCRYPTION_KEY:?TQUANT_SETTINGS_ENCRYPTION_KEY is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ALLOW_INSECURE_HTTP_COOKIE: ${AUTH_ALLOW_INSECURE_HTTP_COOKIE:-false}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-none}
      AGENT_API_BASE: ${AGENT_API_BASE:-http://app:8000/api}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-10}
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      RUNTIME_BACKGROUND_JOBS_ENABLED: ${RUNTIME_SCHEDULER_BACKGROUND_JOBS_ENABLED:-true}
      RUNTIME_BACKGROUND_JOBS_ON_SQLITE: ${RUNTIME_BACKGROUND_JOBS_ON_SQLITE:-false}
      RUNTIME_BACKGROUND_ROLE: scheduler
      RUNTIME_WORKER_EMBED_SCHEDULER: false
      RUNTIME_SCHEDULER_LEADER_LOCK_TTL_SECONDS: ${RUNTIME_SCHEDULER_LEADER_LOCK_TTL_SECONDS:-60}
      RUNTIME_BACKGROUND_COMPACT_MODE_ENABLED: ${RUNTIME_BACKGROUND_COMPACT_MODE_ENABLED:-false}
      RUNTIME_STARTUP_CACHE_PREWARM_ENABLED: ${RUNTIME_STARTUP_CACHE_PREWARM_ENABLED:-true}
      RUNTIME_STARTUP_HISTORY_PREWARM_ENABLED: ${RUNTIME_STARTUP_HISTORY_PREWARM_ENABLED:-true}
      RUNTIME_LOW_BUY_FULL_SCAN_INTERVAL_SECONDS: ${RUNTIME_LOW_BUY_FULL_SCAN_INTERVAL_SECONDS:-3600}
      RUNTIME_WATCHLIST_REFRESH_INTERVAL_SECONDS: ${RUNTIME_WATCHLIST_REFRESH_INTERVAL_SECONDS:-45}
      RUNTIME_MARKET_REGIME_REFRESH_INTERVAL_SECONDS: ${RUNTIME_MARKET_REGIME_REFRESH_INTERVAL_SECONDS:-300}
      RUNTIME_QUOTE_CACHE_REFRESH_INTERVAL_SECONDS: ${RUNTIME_QUOTE_CACHE_REFRESH_INTERVAL_SECONDS:-30}
      RUNTIME_HOURLY_MARKET_SNAPSHOT_INTERVAL_SECONDS: ${RUNTIME_HOURLY_MARKET_SNAPSHOT_INTERVAL_SECONDS:-60}
      RUNTIME_MATERIALIZATION_REFRESH_INTERVAL_SECONDS: ${RUNTIME_MATERIALIZATION_REFRESH_INTERVAL_SECONDS:-300}
      RUNTIME_DAILY_BAR_REFRESH_INTERVAL_SECONDS: ${RUNTIME_DAILY_BAR_REFRESH_INTERVAL_SECONDS:-300}
      RUNTIME_LATEST_DATA_WATCHDOG_INTERVAL_SECONDS: ${RUNTIME_LATEST_DATA_WATCHDOG_INTERVAL_SECONDS:-300}
      RUNTIME_MARKET_REVIEW_INTERVAL_SECONDS: ${RUNTIME_MARKET_REVIEW_INTERVAL_SECONDS:-300}
      MARKET_CLOSE_REVIEW_TIME: ${MARKET_CLOSE_REVIEW_TIME:-15:05}
      RUNTIME_AGENT_DAILY_REPORT_INTERVAL_SECONDS: ${RUNTIME_AGENT_DAILY_REPORT_INTERVAL_SECONDS:-300}
      RUNTIME_LOW_PRIORITY_TASKS_PAUSED: ${RUNTIME_LOW_PRIORITY_TASKS_PAUSED:-false}
      RUNTIME_LOW_PRIORITY_TASK_TYPES: *low_priority_task_types
      PLATFORM_AUTOPILOT_ENABLED: ${PLATFORM_AUTOPILOT_ENABLED:-false}
      PLATFORM_AUTOPILOT_NOTIFY_ENABLED: ${PLATFORM_AUTOPILOT_NOTIFY_ENABLED:-false}
      PLATFORM_AUTOPILOT_FAILED_TASK_WINDOW_HOURS: ${PLATFORM_AUTOPILOT_FAILED_TASK_WINDOW_HOURS:-24}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RUNTIME_EVENT_PUBSUB_BACKEND: ${RUNTIME_EVENT_PUBSUB_BACKEND:-redis}
      SCHEMA_COMPAT_REPAIR_ENABLED: ${SCHEMA_COMPAT_REPAIR_ENABLED:-false}
      GLOBAL_RATE_LIMIT_BACKEND: ${GLOBAL_RATE_LIMIT_BACKEND:-redis}
      GLOBAL_RATE_LIMIT_MAX_CALLS: ${GLOBAL_RATE_LIMIT_MAX_CALLS:-120}
      GLOBAL_RATE_LIMIT_WINDOW_SECONDS: ${GLOBAL_RATE_LIMIT_WINDOW_SECONDS:-1}
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-true}
      MARKET_REVIEW_ENABLED: ${MARKET_REVIEW_ENABLED:-true}
      TQUANT_RESEARCH_JOBS_ENABLED: ${TQUANT_RESEARCH_JOBS_ENABLED:-false}
      TQUANT_ML_JOBS_ENABLED: ${TQUANT_ML_JOBS_ENABLED:-false}
      TQUANT_FACTOR_JOBS_ENABLED: ${TQUANT_FACTOR_JOBS_ENABLED:-false}
      TQUANT_STRATEGY_EVOLUTION_ENABLED: ${TQUANT_STRATEGY_EVOLUTION_ENABLED:-false}
      TQUANT_INTERNAL_SERVICE_TOKEN: ${TQUANT_INTERNAL_SERVICE_TOKEN:-}
      TQUANT_BFF_GATEWAY_URL: ${TQUANT_BFF_GATEWAY_URL:-http://go-bff-gateway:8091}
      TQUANT_MARKET_SERVICE_URL: ${TQUANT_MARKET_SERVICE_URL:-}
      TQUANT_MARKET_READ_SERVICE_URL: ${TQUANT_MARKET_READ_SERVICE_URL:-http://go-market-read-service:8092}
      TQUANT_GO_SCAN_WORKER_URL: ${TQUANT_GO_SCAN_WORKER_URL:-http://go-scan-worker:8093}
      TQUANT_GO_SCAN_ENABLED: ${TQUANT_GO_SCAN_ENABLED:-true}
      TQUANT_STRATEGY_SERVICE_URL: ${TQUANT_STRATEGY_SERVICE_URL:-}
      TQUANT_TRADE_SERVICE_URL: ${TQUANT_TRADE_SERVICE_URL:-}
      TQUANT_ADMIN_SERVICE_URL: ${TQUANT_ADMIN_SERVICE_URL:-}
      TQUANT_FACTOR_SERVICE_URL: ${TQUANT_FACTOR_SERVICE_URL:-}
      TQUANT_BACKTEST_SERVICE_URL: ${TQUANT_BACKTEST_SERVICE_URL:-}
      RUST_FINANCE_MATH_ENABLED: ${RUST_FINANCE_MATH_ENABLED:-true}
      BFF_WORKSPACE_CACHE_ENABLED: ${BFF_WORKSPACE_CACHE_ENABLED:-true}
      BFF_MONITOR_CACHE_TTL_SECONDS: ${BFF_MONITOR_CACHE_TTL_SECONDS:-5}
      BFF_STRATEGY_CACHE_TTL_SECONDS: ${BFF_STRATEGY_CACHE_TTL_SECONDS:-30}
      BFF_SETTINGS_CACHE_TTL_SECONDS: ${BFF_SETTINGS_CACHE_TTL_SECONDS:-30}
    volumes:
      - app_runtime_data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "from app.core.database import ping_database; ping_database()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  analytics-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20-bookworm-slim}
        RUST_BASE_IMAGE: ${RUST_BASE_IMAGE:-docker.m.daocloud.io/library/rust:1.95-bookworm}
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
        INSTALL_ANALYTICS: "1"
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-}
        DEBIAN_APT_SECURITY_MIRROR: ${DEBIAN_APT_SECURITY_MIRROR:-}
    image: tquant-analytics:mysql
    container_name: tquant-analytics-worker-mysql
    restart: unless-stopped
    profiles: ["analytics"]
    mem_limit: ${ANALYTICS_WORKER_MEM_LIMIT:-512m}
    memswap_limit: ${ANALYTICS_WORKER_MEMSWAP_LIMIT:-768m}
    cpus: ${ANALYTICS_WORKER_CPUS:-1.00}
    logging: *default_logging
    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    command: ["python", "/app/backend/scripts/analytics_worker.py", "--poll-interval-seconds", "${ANALYTICS_WORKER_POLL_INTERVAL_SECONDS:-2}"]
    environment:
      APP_NAME: ${APP_NAME:-维斯量化交易平台}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      DATABASE_URL: mysql+mysqldb://${MYSQL_USER:-tquant_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-t_quant}?charset=utf8mb4
      DB_POOL_SIZE: ${ANALYTICS_DB_POOL_SIZE:-4}
      DB_MAX_OVERFLOW: ${ANALYTICS_DB_MAX_OVERFLOW:-4}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      TQUANT_SETTINGS_ENCRYPTION_KEY: ${TQUANT_SETTINGS_ENCRYPTION_KEY:?TQUANT_SETTINGS_ENCRYPTION_KEY is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ALLOW_INSECURE_HTTP_COOKIE: ${AUTH_ALLOW_INSECURE_HTTP_COOKIE:-false}
      SCHEMA_COMPAT_REPAIR_ENABLED: ${SCHEMA_COMPAT_REPAIR_ENABLED:-false}
      TQUANT_ANALYTICS_ENABLED: ${ANALYTICS_WORKER_TQUANT_ANALYTICS_ENABLED:-true}
      TQUANT_DUCKDB_THREADS: ${TQUANT_DUCKDB_THREADS:-2}
      TQUANT_ANALYTICS_ROOT: ${TQUANT_ANALYTICS_ROOT:-/app/backend/data/analytics}
      RUNTIME_LOW_PRIORITY_TASKS_PAUSED: ${RUNTIME_LOW_PRIORITY_TASKS_PAUSED:-false}
      RUNTIME_LOW_PRIORITY_TASK_TYPES: *low_priority_task_types
      GLOBAL_RATE_LIMIT_BACKEND: ${GLOBAL_RATE_LIMIT_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-true}
      APP_WORKERS: "1"
    volumes:
      - app_runtime_data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import duckdb, pyarrow; from app.core.database import ping_database; ping_database()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  migration:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20-bookworm-slim}
        RUST_BASE_IMAGE: ${RUST_BASE_IMAGE:-docker.m.daocloud.io/library/rust:1.95-bookworm}
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-}
        DEBIAN_APT_SECURITY_MIRROR: ${DEBIAN_APT_SECURITY_MIRROR:-}
    image: tquant-web:mysql
    container_name: tquant-migration-mysql
    restart: "no"
    mem_limit: ${MIGRATION_MEM_LIMIT:-512m}
    memswap_limit: ${MIGRATION_MEMSWAP_LIMIT:-768m}
    cpus: ${MIGRATION_CPUS:-1.00}
    logging: *default_logging
    depends_on:
      mysql:
        condition: service_healthy
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: mysql+mysqldb://${MYSQL_USER:-tquant_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-t_quant}?charset=utf8mb4
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-2}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      TQUANT_SETTINGS_ENCRYPTION_KEY: ${TQUANT_SETTINGS_ENCRYPTION_KEY:?TQUANT_SETTINGS_ENCRYPTION_KEY is required}
      SCHEMA_COMPAT_REPAIR_ENABLED: "false"
    volumes:
      - app_runtime_data:/app/backend/data

  mysql-backup:
    image: docker.m.daocloud.io/databack/mysql-backup:latest
    container_name: tquant-mysql-backup
    restart: unless-stopped
    profiles: ["backup"]
    mem_limit: ${MYSQL_BACKUP_MEM_LIMIT:-256m}
    memswap_limit: ${MYSQL_BACKUP_MEMSWAP_LIMIT:-384m}
    cpus: ${MYSQL_BACKUP_CPUS:-0.50}
    logging: *default_logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_SERVER: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-tquant_app}
      DB_PASS: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DB_NAMES: ${MYSQL_DATABASE:-t_quant}
      DB_DUMP_FREQ: ${MYSQL_BACKUP_FREQ:-1440}
      DB_DUMP_BEGIN: ${MYSQL_BACKUP_BEGIN:-0200}
      DB_CLEANUP_TIME: ${MYSQL_BACKUP_RETENTION_MINUTES:-10080}
      DB_DUMP_TARGET: /backups
    volumes:
      - mysql_backups:/backups

  go-bff-gateway:
    build:
      context: ./go-services/bff-gateway
      dockerfile: Dockerfile
    image: tquant-go-bff:mysql
    container_name: tquant-go-bff-gateway
    restart: unless-stopped
    mem_limit: ${GO_BFF_MEM_LIMIT:-128m}
    memswap_limit: ${GO_BFF_MEMSWAP_LIMIT:-192m}
    cpus: ${GO_BFF_CPUS:-0.50}
    logging: *default_logging
    depends_on:
      app:
        condition: service_healthy
      go-market-read-service:
        condition: service_healthy
    environment:
      PORT: 8091
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      TQUANT_PYTHON_API_BASE: http://app:8000
      TQUANT_INTERNAL_SERVICE_TOKEN: ${TQUANT_INTERNAL_SERVICE_TOKEN:-}
      TQUANT_SERVICE_CALL_TIMEOUT_SECONDS: ${TQUANT_SERVICE_CALL_TIMEOUT_SECONDS:-5}
      BFF_SOURCE_TIMEOUT_SECONDS: ${BFF_SOURCE_TIMEOUT_SECONDS:-0.8}
      BFF_WORKSPACE_CACHE_TTL_SECONDS: ${BFF_WORKSPACE_CACHE_TTL_SECONDS:-5}
      BFF_WORKSPACE_STALE_TTL_SECONDS: ${BFF_WORKSPACE_STALE_TTL_SECONDS:-60}
      BFF_MONITOR_DEGRADED_SOURCES_ENABLED: ${BFF_MONITOR_DEGRADED_SOURCES_ENABLED:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/readyz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  go-market-read-service:
    build:
      context: ./go-services/market-read-service
      dockerfile: Dockerfile
    image: tquant-go-market-read:mysql
    container_name: tquant-go-market-read-service
    restart: unless-stopped
    mem_limit: ${GO_MARKET_READ_MEM_LIMIT:-128m}
    memswap_limit: ${GO_MARKET_READ_MEMSWAP_LIMIT:-192m}
    cpus: ${GO_MARKET_READ_CPUS:-0.75}
    logging: *default_logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      PORT: 8092
      TQUANT_INTERNAL_SERVICE_TOKEN: ${TQUANT_INTERNAL_SERVICE_TOKEN:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: mysql+mysqldb://${MYSQL_USER:-tquant_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-t_quant}?charset=utf8mb4
      MYSQL_DSN: ${MYSQL_DSN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8092/readyz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  go-scan-worker:
    build:
      context: ./go-services/scan-worker
      dockerfile: Dockerfile
    image: tquant-go-scan-worker:mysql
    container_name: tquant-go-scan-worker
    restart: unless-stopped
    mem_limit: ${GO_SCAN_WORKER_MEM_LIMIT:-128m}
    memswap_limit: ${GO_SCAN_WORKER_MEMSWAP_LIMIT:-192m}
    cpus: ${GO_SCAN_WORKER_CPUS:-0.50}
    logging: *default_logging
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      PORT: 8093
      TQUANT_PYTHON_API_BASE: http://app:8000
      TQUANT_INTERNAL_SERVICE_TOKEN: ${TQUANT_INTERNAL_SERVICE_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8093/readyz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  app_runtime_data:
  redis_data:
  mysql_backups:
