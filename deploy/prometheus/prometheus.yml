global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - tquant-alerts.yml

scrape_configs:
  - job_name: tquant-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:18090
    # /metrics is admin protected. Store only the token value in this file.
    bearer_token_file: /etc/prometheus/secrets/tquant_admin_token
