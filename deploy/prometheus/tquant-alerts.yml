groups:
  - name: tquant-api
    rules:
      - alert: TQuantHighHttpLatency
        expr: tquant_http_p95_ms > 3000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TQuant API p95 latency is high"
          description: "HTTP p95 latency has been above 3000ms for 5 minutes."

      - alert: TQuantBffLatencyDegraded
        expr: tquant_http_p95_ms > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TQuant BFF/API latency is degraded"
          description: "HTTP p95 latency has been above 2000ms for 5 minutes. Check BFF workspace aggregation and database latency."

      - alert: TQuantProviderFailuresIncreased
        expr: increase(tquant_provider_failures_total[5m]) > 20
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "TQuant market provider failures increased"
          description: "Market provider failures increased by more than 20 in 5 minutes. Check AkShare/EastMoney/OpenBB status and circuit breaker metrics."

      - alert: TQuantRuntimeTaskFailures
        expr: tquant_runtime_tasks_failed > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "TQuant runtime worker has failed tasks"
          description: "At least one runtime task is in failed state."

      - alert: TQuantAgentQualityBlocked
        expr: tquant_agent_quality_blocked_total > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "TQuant Agent quality gate blocked multiple outputs"
          description: "Agent output quality failures increased in the last 15 minutes."

      - alert: TQuantAgentToolFailures
        expr: tquant_agent_tool_failure_total > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "TQuant Agent tool failures increased"
          description: "Agent tool failures increased in the last 15 minutes."

      - alert: TQuantBffPartialSourceTimeouts
        expr: increase(tquant_bff_gateway_partial_source_failures_total{reason="timeout"}[5m]) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "TQuant BFF source timeouts increased"
          description: "BFF source timeouts exceeded budget. Check slow Python source endpoints and BFF source timeout settings."

      - alert: TQuantBffPartialSourceErrors
        expr: increase(tquant_bff_gateway_partial_source_failures_total{reason=~"status|decode|other"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "TQuant BFF source errors observed"
          description: "BFF source returned non-2xx, invalid JSON, or unclassified errors. Inspect partial_errors by source."

      - alert: TQuantMarketReadUnresolvedMisses
        expr: increase(tquant_market_read_unresolved_misses_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TQuant market-read unresolved quote misses"
          description: "Go market-read could not satisfy requested symbols from Redis or MySQL fallback."

      - alert: TQuantMarketReadMysqlFallbackSpike
        expr: increase(tquant_market_read_mysql_fallbacks_total[5m]) > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TQuant market-read MySQL fallback spike"
          description: "Redis quote cache misses are being served by MySQL fallback at elevated volume. Check quote cache warmup and Redis health."
